
name: Task Manager CI and Auto Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: python -m pytest backend/test_app.py -v

  publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify RDS integration
        run: |
          grep -q 'def use_database' backend/app.py

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            manasabolla/flask-backenddb:latest
            manasabolla/flask-backenddb:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST"
          test -n "$EC2_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to EC2 and check health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/ec2.pem \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "IMAGE_TAG=$IMAGE_TAG bash -s" <<'REMOTE'
          set -Eeuo pipefail

          sudo test -s /opt/task-manager/backend.env

          IMAGE="manasabolla/flask-backenddb:${IMAGE_TAG}"

          sudo docker pull "$IMAGE"

          sudo docker run --rm --entrypoint python "$IMAGE" \
            -c "import app; assert hasattr(app, 'use_database'); print('RDS integration verified')"

          BACKUP="flask-backenddb-rds-backup-$(date +%Y%m%d%H%M%S)"
          HAD_OLD=false

          if sudo docker container inspect flask-backenddb-rds >/dev/null 2>&1; then
            sudo docker stop flask-backenddb-rds || true
            sudo docker rename flask-backenddb-rds "$BACKUP"
            HAD_OLD=true
          fi

          rollback() {
            sudo docker rm -f flask-backenddb-rds >/dev/null 2>&1 || true
            if [ "$HAD_OLD" = true ]; then
              sudo docker rename "$BACKUP" flask-backenddb-rds
              sudo docker start flask-backenddb-rds
            fi
          }

          if ! sudo docker run -d \
            --name flask-backenddb-rds \
            --restart unless-stopped \
            --env-file /opt/task-manager/backend.env \
            -p 5000:5000 \
            "$IMAGE"; then
            rollback
            exit 1
          fi

          HEALTHY=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent http://127.0.0.1:5000/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:5000/api/tasks >/dev/null; then
              HEALTHY=true
              break
            fi
            sleep 5
          done

          if [ "$HEALTHY" != true ]; then
            sudo docker logs --tail 80 flask-backenddb-rds || true
            rollback
            echo "Deployment failed; previous container restored where available."
            exit 1
          fi

          echo "Deployment successful: $IMAGE"
          REMOTE
